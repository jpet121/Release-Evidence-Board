name: Ordinary Go checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/scripts/**'
      - '.github/workflows/verify.yml'
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Use the Windows runner work volume for native storage tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - run: go mod verify
      - run: go test -count=1 ./...
      - name: Test storage faults on an isolated Linux filesystem
        if: runner.os == 'Linux'
        run: bash .github/scripts/test-linux-storage.sh
      - run: go vet ./...
